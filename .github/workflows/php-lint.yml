name: PHP checks
on:
  push:
    branches:
      - main
      - feature/media-manager-2.0
  pull_request:
    branches:
      - main
      - feature/media-manager-2.0
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
