name: Build and publish plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Build installable plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/ua-mediamanager
          cp ua-mediamanager.php package/ua-mediamanager/
          cp -R includes assets package/ua-mediamanager/
          cp README.md package/ua-mediamanager/
          cd package
          zip -qr ../ua-mediamanager.zip ua-mediamanager

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ua-mediamanager.zip
